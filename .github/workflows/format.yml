name: Format

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  format-check:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
