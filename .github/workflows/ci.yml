name: CI




on:
  workflow_dispatch: 
  pull_request:
    branches:
      - main
env:
  BUILD_CONFIGURATION: Release



jobs:
 build-and-test: 
  name: Bygg och testa
  runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install dotnet
      uses: actions/setup-dotnet@v6
      with:
       dotnet-version: '10.0.x'

    - name: Setup dotnet
      run: |
        dotnet restore
        dotnet build --no-restore --configuration $BUILD_CONFIGURATION
        dotnet test --no-build --configuration $BUILD_CONFIGURATION

  
    - name: Vem och vad startade det här?

      env:
        STARTAD_AV: ${{ github.actor }}
        HANDELSE: ${{ github.event_name }}
        GREN: ${{ github.head_ref }}
      run: |
        echo "Startad av $STARTAD_AV -- händelse: $HANDELSE -- gren: $GREN"
        
        
    
      
    
